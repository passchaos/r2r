name: ROS CI

on:
  push:
    branches:
      - master
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  docs_no_ros:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - run: docker build . --file ./tests/Dockerfile_no_ros --tag r2r_no_ros
    - name: Verify all targets and public API documentation without ROS
      run: docker run r2r_no_ros python3 tests/check_documentation.py

  quality_jazzy:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - run: docker build . --file ./tests/Dockerfile_ros --build-arg ROS_DISTRO=jazzy --tag r2r_jazzy
    - name: Check formatting
      run: docker run r2r_jazzy cargo fmt --all -- --check
    - name: Run Clippy
      run: docker run r2r_jazzy cargo clippy --workspace --all-targets -- -D warnings
    - name: Verify optimized runtime behavior
      run: docker run r2r_jazzy cargo test -p r2r --lib --release -- --test-threads=1
    - name: Verify lifecycle publication API boundaries
      run: docker run r2r_jazzy python3 tests/lifecycle_publication_api.py

  minimal_workspace_jazzy:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Checkout tools repo
      uses: actions/checkout@v4
      with:
        repository: m-dahl/r2r_minimal_node
        path: r2r_minimal_node
    - run: docker build . --file ./tests/Dockerfile_ros --build-arg ROS_DISTRO=jazzy --tag r2r_jazzy
    - run: docker run r2r_jazzy /r2r/tests/build_minimal_node.bash

  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ros_distro: [humble, iron, jazzy, kilted, lyrical, rolling]
    steps:
    - uses: actions/checkout@v4
    - name: Build ROS test environment
      run: docker build . --file ./tests/Dockerfile_ros --build-arg ROS_DISTRO=${{ matrix.ros_distro }} --tag r2r_test
    - name: Run workspace tests
      run: docker run r2r_test cargo test --workspace -- --test-threads=1
    - name: Check service-event oracle rejection cases
      run: docker run r2r_test python3 -m unittest discover -s tools/ros_oracles -p test_service_events.py
    - name: Check ROS-clock sleep oracle rejection cases
      run: docker run r2r_test python3 -m unittest discover -s tools/ros_oracles -p test_ros_sleep.py
    - name: Verify native ROS-clock sleep semantics against C++
      run: |
        mkdir -p ros-sleep-results
        docker run --rm -v "$PWD/ros-sleep-results:/results" r2r_test bash -c '
          set -e
          python3 tools/ros_oracles/ros_sleep.py build --output-dir target/ros-sleep
          python3 tools/ros_oracles/ros_sleep.py run --binaries target/ros-sleep \
            --rmw rmw_cyclonedds_cpp --domain-id 158 --output /results/cyclonedds.json
          python3 tools/ros_oracles/ros_sleep.py run --binaries target/ros-sleep \
            --rmw rmw_fastrtps_cpp --domain-id 160 --output /results/fastdds.json
        '
    - name: Save ROS sleep interoperability evidence
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: ros-sleep-${{ matrix.ros_distro }}
        path: ros-sleep-results/
    - name: Check QoS-event oracle rejection cases
      run: docker run r2r_test python3 -m unittest discover -s tools/ros_oracles -p test_qos_events.py
    - name: Check type-description oracle rejection cases
      run: docker run r2r_test python3 -m unittest discover -s tools/ros_oracles -p test_type_descriptions.py
    - name: Verify native type descriptions against independent C++ endpoints
      if: matrix.ros_distro != 'humble' && matrix.ros_distro != 'iron'
      run: |
        mkdir -p type-description-results
        docker run --rm -v "$PWD/type-description-results:/results" r2r_test bash -c '
          set -e
          python3 tools/ros_oracles/type_descriptions.py build --output-dir target/type-descriptions
          python3 tools/ros_oracles/type_descriptions.py run --binaries target/type-descriptions \
            --rmw rmw_cyclonedds_cpp --domain-id 150 --output /results/cyclonedds.json
          python3 tools/ros_oracles/type_descriptions.py run --binaries target/type-descriptions \
            --rmw rmw_fastrtps_cpp --domain-id 152 --output /results/fastdds.json
          python3 tools/ros_oracles/type_descriptions.py verify --require-current-sources \
            --require-exact-sources /results/cyclonedds.json /results/fastdds.json
        '
    - name: Save type-description interoperability evidence
      if: always() && matrix.ros_distro != 'humble' && matrix.ros_distro != 'iron'
      uses: actions/upload-artifact@v4
      with:
        name: type-descriptions-${{ matrix.ros_distro }}
        path: type-description-results/
    - name: Verify native QoS event streams against C++ endpoints
      run: |
        mkdir -p qos-results
        docker run --rm -v "$PWD/qos-results:/results" r2r_test bash -c '
          set -e
          python3 tools/ros_oracles/qos_events.py build --output-dir target/qos-events
          python3 tools/ros_oracles/qos_events.py run --binaries target/qos-events \
            --rmw rmw_cyclonedds_cpp --domain-id 146 --output /results/cyclonedds.json
          python3 tools/ros_oracles/qos_events.py run --binaries target/qos-events \
            --rmw rmw_fastrtps_cpp --domain-id 148 --output /results/fastdds.json
        '
    - name: Save native QoS diagnostic evidence
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: qos-events-${{ matrix.ros_distro }}
        path: qos-results/
    - name: Verify external Rust and C++ service introspection
      if: matrix.ros_distro != 'humble'
      run: |
        mkdir -p interop-results
        docker run --rm -v "$PWD/interop-results:/results" r2r_test bash -c '
          set -e
          python3 tools/ros_oracles/service_events.py build --output-dir target/service-events
          python3 tools/ros_oracles/service_events.py run --binaries target/service-events \
            --rmw rmw_cyclonedds_cpp --domain-id 142 --output /results/cyclonedds.json
          python3 tools/ros_oracles/service_events.py run --binaries target/service-events \
            --rmw rmw_fastrtps_cpp --domain-id 144 --output /results/fastdds.json
        '
    - name: Verify Humble service introspection boundary
      if: matrix.ros_distro == 'humble'
      run: |
        docker run r2r_test bash -c '
          cargo build -p r2r --example service_introspection_interop || exit
          target/debug/examples/service_introspection_interop
          test "$?" -eq 2
        '
    - name: Save service introspection interoperability evidence
      if: always() && matrix.ros_distro != 'humble'
      uses: actions/upload-artifact@v4
      with:
        name: service-introspection-${{ matrix.ros_distro }}
        path: interop-results/
